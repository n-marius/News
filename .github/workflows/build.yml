name: Sammeln und veröffentlichen

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Feeds sammeln
        if: github.event_name != 'push'
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: node scripts/fetch.mjs
      - name: Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine Änderungen."; else git commit -m "Daten aktualisiert"; git pull --rebase -q; git push; fi
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons data config _site/
          rm -f _site/config/keywords.json _site/config/sources.json _site/config/push.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
